# Server configuration
[server]
http_addr = "0.0.0.0:8080"
grpc_addr = "0.0.0.0:9090"
http_enabled = true
grpc_enabled = true

# Storage configuration
[storage]
engine = "Disk"
data_dir = "/var/lib/minikv/data"

# Consensus configuration
[consensus]
mode = "Cluster"

# Raft configuration
[consensus.raft]
node_id = 1  # Change this for each node
election_timeout_ms = 1000
heartbeat_interval_ms = 100
snapshot_threshold = 10000

# Cluster peers
[[consensus.raft.peers]]
node_id = 1
addr = "node1:9090"

[[consensus.raft.peers]]
node_id = 2
addr = "node2:9090"

[[consensus.raft.peers]]
node_id = 3
addr = "node3:9090"

# Logging configuration
[logging]
level = "info"
format = "json"